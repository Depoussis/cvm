# Bonificações que a API pública da B3 (GetListedSupplementCompany, campo stockDividends) não lista, encontradas pela
# validação contra fontes externas (scripts/validar_fontes.py, verificação "eventos"; ver docs/validacao_dados.md).
#
# Critério para entrar aqui: (1) o Yahoo Finance regista o evento na data ex; (2) no COTAHIST da B3 todas as classes
# do emissor caem nesse pregão perto do fator (sem o evento a variação ficaria perto de zero). Sem a correção, o
# simulador e o modelo veem uma queda falsa de 4 % a 23 % nesse dia.
#
# emissor: raiz de 4 letras do ticker (aplica-se a todas as ações e units do emissor)
# data_com: último pregão com direito (o evento entra no pregão seguinte)
# percentual: ações novas por cada 100 (fator de preço = 1 / (1 + percentual / 100)), como a B3 publica
# Se a B3 passar a publicar o mesmo evento (mesmo emissor e data com), vale o oficial e esta linha é ignorada.
# Depois de mudar este ficheiro: correr gold_b3 em modo reprocess e depois gold_b3_proventos.
