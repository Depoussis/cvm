# Configuração do ambiente de desenvolvimento. Sem segredos: autenticação por Entra ID / Managed Identity.
# Os nomes dos recursos Azure vêm do deployment Bicep "fundacao-dev" (ver docs/deployment.md).
env: dev

azure:
  subscription_id: a51d7d8f-69ec-4d14-83d5-150aeade439a
  resource_group: rg-findata-dev
  location: northeurope
  storage_account: stfindatadev73r4pl
  key_vault: kv-findata-dev-73r4pl
  data_factory: adf-findata-dev-73r4pl
  access_connector_id: /subscriptions/a51d7d8f-69ec-4d14-83d5-150aeade439a/resourceGroups/rg-findata-dev/providers/Microsoft.Databricks/accessConnectors/ac-findata-dev

databricks:
  host: https://adb-7405612954969039.19.azuredatabricks.net
  sql_warehouse_name: Serverless Starter Warehouse
  job:
    # Os agendamentos dos jobs ficam em PAUSE: quem agenda é o ADF (pipelines/azure_data_factory/trigger).
    # serverless: não usa a quota de vCPUs da subscrição e só cobra enquanto corre.
    # classic: cluster de jobs single-node (exige um tipo de VM habilitado na subscrição; no Free Trial o
    #          Databricks reporta os tipos DSv2/Dv5 como NotEnabledOnSubscription).
    compute: serverless
    spark_version: 16.4.x-scala2.12
    node_type: Standard_DS3_v2
    timeout_tarefa_s: 3600
    cron: "0 0 20 ? * MON-FRI"    # 20:00 de Brasília, depois da PTAX de fechamento e das séries diárias
    cron_cvm: "0 0 8 ? * *"       # 08:00 de Brasília, todos os dias (a CVM atualiza os ficheiros de madrugada)
    cron_b3: "0 30 21 ? * MON-FRI"  # 21:30 de Brasília (a B3 publica o COTAHIST do dia por volta das 20:50)
    cron_frescura: "0 0 22 ? * MON-FRI"  # só usado se o agendamento for pelo Databricks (por omissão: ADF)
    cron_auditoria: "0 0 6 ? * SUN"  # domingo 06:00: testes de integração e reconciliação
    timezone: America/Sao_Paulo

unity_catalog:
  catalog: findata_dev
  storage_credential: sc_findata_dev
  # Localização gerida do catálogo (o metastore regional não tem raiz de armazenamento).
  catalog_location: abfss://control@stfindatadev73r4pl.dfs.core.windows.net/_catalog
  # schema -> contêiner/pasta ADLS onde ficam as tabelas geridas desse schema.
  # Localizações geridas e volumes não podem sobrepor-se, por isso cada uma tem a sua pasta.
  schemas:
    bronze: { container: bronze, path: tables, comment: "Dados como recebidos das fontes, com metadados de ingestão" }
    silver: { container: silver, path: tables, comment: "Dados limpos, tipados, deduplicados e historizados (SCD1/SCD2)" }
    gold: { container: gold, path: tables, comment: "Modelo dimensional e indicadores para consumo analítico" }
    control: { container: control, path: tables, comment: "Controlo de execução, watermarks, qualidade e registo de ficheiros" }
    ops: { container: control, path: ops, comment: "Volumes operacionais: ficheiros originais, checkpoints e quarentena" }
  # volumes externos: nome -> (schema, contêiner)
  volumes:
    raw: { schema: ops, container: raw, comment: "Ficheiros e payloads originais, imutáveis" }
    checkpoints: { schema: ops, container: checkpoints, comment: "Checkpoints de streaming e Auto Loader" }
    quarantine: { schema: ops, container: quarantine, comment: "Payloads inválidos e ficheiros corrompidos" }
  # Grupos de conta (criados na consola de conta do Databricks). Grupos inexistentes são ignorados com aviso.
  groups:
    engineers: grp_findata_engineers
    analysts: grp_findata_analysts
